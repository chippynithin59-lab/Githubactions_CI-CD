name: ABCproject_pipelineinGithubactions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code123
        uses: actions/checkout@v4

      - name: Print present working directory
        run: pwd

      - name: Print list of directories
        run: ls

      - name: Date of the day
        run: date
      
